name: Build

on:
  workflow_dispatch:
  push:
  pull_request:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (CPU)
            os: windows-latest
            artifact: reaspeech-windows-x86_64-cpu
            source: target/release/reaper_reaspeech.dll
            output: reaper_reaspeech.dll
          - name: Linux (CPU)
            os: ubuntu-22.04
            artifact: reaspeech-linux-x86_64-cpu
            source: target/release/libreaper_reaspeech.so
            output: reaper_reaspeech.so

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.artifact }}

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Stage extension
        shell: bash
        run: |
          mkdir -p artifact
          cp "${{ matrix.source }}" "artifact/${{ matrix.output }}"

      - name: Upload extension
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifact/
          if-no-files-found: error

  build-macos:
    name: macOS universal (Metal)
    runs-on: macos-14

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: reaspeech-macos-universal-metal

      - name: Test
        run: cargo test --locked --features metal

      - name: Build arm64
        run: cargo build --release --locked --features metal --target aarch64-apple-darwin

      - name: Build x86_64
        run: cargo build --release --locked --features metal --target x86_64-apple-darwin

      - name: Create universal extension
        run: |
          mkdir -p artifact
          lipo -create \
            target/aarch64-apple-darwin/release/libreaper_reaspeech.dylib \
            target/x86_64-apple-darwin/release/libreaper_reaspeech.dylib \
            -output artifact/reaper_reaspeech.dylib
          lipo -archs artifact/reaper_reaspeech.dylib

      - name: Upload extension
        uses: actions/upload-artifact@v4
        with:
          name: reaspeech-macos-universal-metal
          path: artifact/
          if-no-files-found: error

  build-cuda:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (CUDA 13, default)
            os: windows-latest
            cuda-version: 13.1.0
            artifact: reaspeech-windows-x86_64-cuda
            source: target/release/reaper_reaspeech.dll
            output: reaper_reaspeech.dll
          - name: Windows (CUDA 12)
            os: windows-latest
            cuda-version: 12.9.1
            artifact: reaspeech-windows-x86_64-cuda12
            source: target/release/reaper_reaspeech.dll
            output: reaper_reaspeech.dll
          - name: Linux (CUDA 13, default)
            os: ubuntu-22.04
            cuda-version: 13.1.0
            artifact: reaspeech-linux-x86_64-cuda
            source: target/release/libreaper_reaspeech.so
            output: reaper_reaspeech.so
          - name: Linux (CUDA 12)
            os: ubuntu-22.04
            cuda-version: 12.9.1
            artifact: reaspeech-linux-x86_64-cuda12
            source: target/release/libreaper_reaspeech.so
            output: reaper_reaspeech.so

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install CUDA ${{ matrix.cuda-version }}
        uses: Jimver/cuda-toolkit@v0.2.30
        with:
          cuda: ${{ matrix.cuda-version }}
          method: network
          sub-packages: '["nvcc", "cudart", "cublas"]'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.artifact }}-${{ matrix.cuda-version }}

      - name: Build
        run: cargo build --release --locked --features cuda

      - name: Stage extension
        shell: bash
        run: |
          mkdir -p artifact
          cp "${{ matrix.source }}" "artifact/${{ matrix.output }}"

      - name: Upload extension
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifact/
          if-no-files-found: error

